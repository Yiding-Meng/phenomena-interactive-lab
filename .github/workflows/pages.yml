name: Deploy Phenomena to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Assemble static site
        run: |
          rm -rf site
          mkdir -p site/src site/vendor
          cp index.html styles.css site/
          cp src/simmath.js src/routing.js src/domains.js src/blueprint-compiler.js src/chart-renderer.js src/standalone-builder.js src/app.js site/src/
          cp -R vendor/katex site/vendor/katex

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - name: Deploy Pages
        id: deployment
        uses: actions/deploy-pages@v4
